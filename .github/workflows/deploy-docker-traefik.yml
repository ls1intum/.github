name: Deploy Docker Compose

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "The deployment environment (e.g., production, staging)"
        required: true

      image-tag:
        type: string
        description: "Image tag of traefik to deploy (https://hub.docker.com/_/traefik)"
        required: true

jobs:

  deploy:
    needs: prepare-deploy
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ls1intum/.github

      - name: SSH to VM and execute docker compose down (if exists)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          script: |
            #!/bin/bash
            set -e  # Exit immediately if a command exits with a non-zero status

            BASE_PATH="/opt/traefik"
            COMPOSE_FILE="$BASE_PATH/docker-compose.yml"

            # Check if docker-compose file exists
            if [ -f "$COMPOSE_FILE" ]; then
              echo "$COMPOSE_FILE found."
          
              # Check if .env with env-file-name exists
              if [ -f "$BASE_PATH/${{ inputs.env-file-name }}" ]; then
                docker compose -f "$COMPOSE_FILE" --env-file="$BASE_PATH/${{ inputs.env-file-name }}" down --remove-orphans --rmi all ${{ inputs.remove_volumes && '--volumes' || '' }}
              else
                docker compose -f "$COMPOSE_FILE" down --remove-orphans --rmi all
              fi
            else
              echo "$COMPOSE_FILE does not exist. Skipping docker compose down."
            fi

      - name: Copy docker compose file to VM host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          source: traefik/docker-compose.yml
          target: /opt/traefik

      - name: Create local .env file
        run: |
          ENV_FILE=".env"
          
          # Start by adding static environment variables
          echo "ENVIRONMENT=${{ inputs.environment }}" > "$ENV_FILE"
          echo "IMAGE_TAG=${{ inputs.image-tag }}" >> "$ENV_FILE"

          # Append HARICA ACME secrets if provided
          echo "$SECRETS_CONTEXT" | jq -r '
            {HARICA_ACME_CA_SERVER, HARICA_ACME_EAB_KID, HARICA_ACME_EAB_HMAC}
            | to_entries[]
            | select(.value != null and .value != "")
            | "\(.key)=\(.value | @json)"
          ' >> "$ENV_FILE"

          # Append variables from VARS_CONTEXT with quoted and escaped values, excluding certain keys
          echo "$VARS_CONTEXT" | jq -r '
            del(
              .DEPLOYMENT_GATEWAY_PORT,
              .DEPLOYMENT_GATEWAY_USER,
              .DEPLOYMENT_GATEWAY_HOST,
              .VM_USERNAME,
              .VM_HOST
            )
            | to_entries[]
            | "\(.key)=\(.value | @json)"
          ' >> "$ENV_FILE"
        env:
          VARS_CONTEXT: ${{ toJson(vars) }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Copy .env file to VM host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          source: .env
          target: /opt/traefik

      - name: SSH to VM and execute docker compose up
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          script: |
            BASE_PATH="/opt/traefik"
            docker compose -f "$BASE_PATH/docker-compose.yml" --env-file="$BASE_PATH/.env" up --pull=always -d
